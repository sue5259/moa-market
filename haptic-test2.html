<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>진동 진단 2</title>
<style>
  :root { --brand: #0F6B5C; --muted: #5F6873; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #F3F4F6; color: #16191D; font: 18px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 140px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 0 0 4px; }
  .card { background: #fff; border: 1px solid #E4E7EB; border-radius: 14px; padding: 16px; margin-top: 14px; }
  .muted { color: var(--muted); font-size: 16px; }
  button.t { display: block; width: 100%; min-height: 58px; margin-top: 10px; border: 0; border-radius: 12px;
    background: var(--brand); color: #fff; font: inherit; font-weight: 700; touch-action: manipulation; }
  .count { font-size: 15px; color: var(--muted); margin-top: 6px; }

  /* 모든 숨김 스위치: 정상 크기, 화면 안(왼쪽 아래 고정) */
  .hs { position: fixed; left: 8px; bottom: 8px; margin: 0; }
  .hs input { margin: 0; }

  /* A: 불투명 덮개 아래에 숨김 */
  #A { z-index: 1; }
  .cover { position: fixed; left: 0; bottom: 0; width: 120px; height: 60px; background: #F3F4F6; z-index: 2; }
  /* B: 투명도 0.01, 정상 크기 */
  #B { opacity: 0.01; z-index: 3; }
  /* C: 투명도 0 */
  #C { opacity: 0; z-index: 3; }
  /* D: 아주 작게 축소 */
  #D { transform: scale(0.05); transform-origin: left bottom; z-index: 3; }
  /* E: 거의 다 잘라냄 (1px만 보임) */
  #E { clip-path: inset(0 calc(100% - 1px) calc(100% - 1px) 0); z-index: 3; }
  /* F: 바닥 아래로 거의 다 내림 (2px만 화면 안) */
  #F { bottom: auto; top: calc(100vh - 2px); z-index: 3; }
  /* G: 덮개 아래 + 투명도 0.01 */
  #G { opacity: 0.01; z-index: 1; }
  .hs { pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>진동 진단 2</h1>
  <p class="muted">각 버튼을 누르고 손에 '톡' 느낌이 있었는지 확인해 주세요. 결과를 A~H별 O/X로 알려 주세요. (1차에서 ③이 됐으므로 H는 확인용입니다)</p>

  <section class="card"><h2>A. 덮개 아래 숨긴 스위치</h2><p class="muted">불투명한 판 밑에 정상 스위치</p>
    <button class="t" data-test="A">A 테스트</button><div class="count" id="cA"></div></section>
  <section class="card"><h2>B. 투명도 1%, 정상 크기</h2>
    <button class="t" data-test="B">B 테스트</button><div class="count" id="cB"></div></section>
  <section class="card"><h2>C. 투명도 0, 정상 크기</h2>
    <button class="t" data-test="C">C 테스트</button><div class="count" id="cC"></div></section>
  <section class="card"><h2>D. 아주 작게 축소</h2>
    <button class="t" data-test="D">D 테스트</button><div class="count" id="cD"></div></section>
  <section class="card"><h2>E. 1px만 남기고 잘라냄</h2>
    <button class="t" data-test="E">E 테스트</button><div class="count" id="cE"></div></section>
  <section class="card"><h2>F. 화면 아래로 내림 (2px만 화면 안)</h2>
    <button class="t" data-test="F">F 테스트</button><div class="count" id="cF"></div></section>
  <section class="card"><h2>G. 덮개 아래 + 투명도 1%</h2>
    <button class="t" data-test="G">G 테스트</button><div class="count" id="cG"></div></section>
  <section class="card"><h2>H. 보이는 스위치 (1차 ③과 동일, 확인용)</h2>
    <label id="H" style="display:flex;align-items:center;gap:12px;font-weight:700;margin-top:6px"><input type="checkbox" switch> 보이는 스위치</label>
    <button class="t" data-test="H">H 테스트</button><div class="count" id="cH"></div></section>
</main>

<div class="cover" aria-hidden="true"></div>
<label class="hs" id="A" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<label class="hs" id="B" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<label class="hs" id="C" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<label class="hs" id="D" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<label class="hs" id="E" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<label class="hs" id="F" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>
<label class="hs" id="G" aria-hidden="true"><input type="checkbox" switch tabindex="-1"></label>

<script>
  const counts = {};
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-test]');
    if (!b) return;
    const k = b.dataset.test;
    document.getElementById(k).click();
    counts[k] = (counts[k] || 0) + 1;
    document.getElementById('c' + k).textContent = `실행 ${counts[k]}회`;
  });
</script>
</body>
</html>
