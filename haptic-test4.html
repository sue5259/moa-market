<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>진동 진단 4</title>
<style>
  :root { --brand: #0F6B5C; --muted: #5F6873; --bg: #F3F4F6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: #16191D; font: 18px/1.55 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; word-break: keep-all; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 19px; margin: 0 0 4px; }
  .card { position: relative; background: #fff; border: 1px solid #E4E7EB; border-radius: 14px; padding: 16px; margin-top: 14px; }
  .muted { color: var(--muted); font-size: 16px; }
  button.t { display: block; width: 100%; min-height: 58px; margin-top: 10px; border: 0; border-radius: 12px;
    background: var(--brand); color: #fff; font: inherit; font-weight: 700; touch-action: manipulation; position: relative; z-index: 5; }
  .count { font-size: 15px; color: var(--muted); margin-top: 6px; }
  .slot { position: relative; height: 56px; margin-top: 8px; border-radius: 10px; background: #FFF4C2; }

  /* 모두 고정(fixed)이 아닌 배치 */
  .sw { margin: 0; line-height: 0; display: inline-block; }
  .sw input { margin: 0; }
  .abs { position: absolute; left: 12px; top: 14px; }
  #L3 { opacity: 0.01; }
  #L4 { opacity: 0; }
  #L5 { z-index: 1; }
  .cover { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border-radius: 10px; background: #FFF4C2; z-index: 2; }
  .cover.pass { pointer-events: none; }
  #L7 { transform: scale(0.1); transform-origin: left top; }
  .clip1 { position: absolute; left: 12px; top: 14px; width: 1px; height: 1px; overflow: hidden; }
</style>
</head>
<body>
<main>
  <h1>진동 진단 4</h1>
  <p class="muted">버튼을 하나씩 누르고 '톡' 느낌이 있었는지 알려 주세요 (1~8번 O/X). 노란 칸은 실험 앱의 경고 영역을 흉내 낸 것입니다.</p>

  <section class="card"><h2>1. 보이는 스위치 (일반 배치, 되어야 정상)</h2>
    <label class="sw" id="L1"><input type="checkbox" switch tabindex="-1"></label>
    <button class="t" data-test="L1">1번 테스트</button><div class="count" id="cL1"></div></section>

  <section class="card"><h2>2. 노란 칸 안, 보이는 스위치</h2>
    <div class="slot"><label class="sw abs" id="L2"><input type="checkbox" switch tabindex="-1"></label></div>
    <button class="t" data-test="L2">2번 테스트</button><div class="count" id="cL2"></div></section>

  <section class="card"><h2>3. 노란 칸 안, 투명도 1%</h2>
    <div class="slot"><label class="sw abs" id="L3"><input type="checkbox" switch tabindex="-1"></label></div>
    <button class="t" data-test="L3">3번 테스트</button><div class="count" id="cL3"></div></section>

  <section class="card"><h2>4. 노란 칸 안, 투명도 0</h2>
    <div class="slot"><label class="sw abs" id="L4"><input type="checkbox" switch tabindex="-1"></label></div>
    <button class="t" data-test="L4">4번 테스트</button><div class="count" id="cL4"></div></section>

  <section class="card"><h2>5. 노란 칸 안, 노란 판으로 덮음 (터치 통과)</h2>
    <div class="slot"><label class="sw abs" id="L5"><input type="checkbox" switch tabindex="-1"></label><div class="cover pass"></div></div>
    <button class="t" data-test="L5">5번 테스트</button><div class="count" id="cL5"></div></section>

  <section class="card"><h2>6. 노란 칸 안, 노란 판으로 덮음 (터치 막음)</h2>
    <div class="slot"><label class="sw abs" id="L6" style="z-index:1"><input type="checkbox" switch tabindex="-1"></label><div class="cover"></div></div>
    <button class="t" data-test="L6">6번 테스트</button><div class="count" id="cL6"></div></section>

  <section class="card"><h2>7. 노란 칸 안, 10%로 축소</h2>
    <div class="slot"><label class="sw abs" id="L7"><input type="checkbox" switch tabindex="-1"></label></div>
    <button class="t" data-test="L7">7번 테스트</button><div class="count" id="cL7"></div></section>

  <section class="card"><h2>8. 노란 칸 안, 1px 칸에 잘라 넣음</h2>
    <div class="slot"><div class="clip1"><label class="sw" id="L8"><input type="checkbox" switch tabindex="-1"></label></div></div>
    <button class="t" data-test="L8">8번 테스트</button><div class="count" id="cL8"></div></section>
</main>

<script>
  const counts = {};
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-test]');
    if (!b) return;
    const k = b.dataset.test;
    document.getElementById(k).click();
    counts[k] = (counts[k] || 0) + 1;
    document.getElementById('c' + k).textContent = `실행 ${counts[k]}회`;
  });
</script>
</body>
</html>
